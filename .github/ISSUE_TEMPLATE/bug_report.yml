name: Bug report
description: Something does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Notebook never overwrites a file it cannot read and keeps backups in `Notebooks/_backup/`: if a notebook looks damaged, don't delete anything, and try **Notebook: Repair damaged notebook** first.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Settings → Community plugins → Notebook.
      placeholder: "0.12.0"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android tablet
        - Android phone
        - iPad
        - iPhone
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device model and stylus
      placeholder: "Samsung Galaxy Tab S9, S Pen"
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
      description: Settings → About.
      placeholder: "1.9.10"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a notebook with a PDF page
        2. Select the highlighter
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Screenshots or a short screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        For pen or side-button problems, paste the output of the **Pen button test** (command palette → *Notebook: Pen button test*, press the button a few times, then **Copy log**).
        For other errors: on Android, connect to a PC and open `chrome://inspect`; on desktop, open the developer console (Ctrl+Shift+I). Lines from this plugin start with `[notebook]`.
      render: text
