name: Release

# Push a tag equal to the manifest version (e.g. 0.2.0) to build, attest and publish a release.
# A tag like 0.2.0-beta.1 (manifest version + "-suffix") publishes a pre-release for BRAT testers;
# the community directory ignores it because it follows the manifest version on main.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test and lint
        run: |
          npm test
          npm run lint

      - name: Build
        run: npm run build

      - name: Check that the tag matches manifest.json
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "$version" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME#"$version-"}" != "$GITHUB_REF_NAME" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags
