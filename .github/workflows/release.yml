name: Release

# Push a tag equal to the manifest version (e.g. 0.1.1) to build, attest and publish a release.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test and lint
        run: |
          npm test
          npm run lint

      - name: Build
        run: npm run build

      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
